aid: ai-therapeutics
name: AI Therapeutics
description: >-
  AI Therapeutics (now Orphai Therapeutics) is a clinical-stage biopharmaceutical company founded in
  Guilford, Connecticut by Jonathan Rothberg as LAM Therapeutics, renamed AI Therapeutics, and renamed
  again to OrphAI Therapeutics in September 2023. It built an internal deep-learning platform that
  synthesized public and proprietary drug and disease data to match existing chemical entities to new
  indications, and used it to advance a rare-disease and pulmonary pipeline — LAM-001, an inhaled
  formulation of sirolimus (rapamycin) targeting mTOR-driven pulmonary disease, plus the earlier
  PIKfyve inhibitor programs LAM-002 and LAM-003. Quince Therapeutics (Nasdaq: QNCX) acquired Orphai
  in May 2026 and now runs it as a subsidiary. The AI platform is an internal drug-discovery tool, not
  a product: the company operates no developer program, publishes no API, SDK or machine-readable
  contract, and its public web presence is a single-page corporate site.
